name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only keep the latest run per ref; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    # The application lives in a nested directory; run every step there.
    defaults:
      run:
        working-directory: visaflow-assistant-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: visaflow-assistant-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
